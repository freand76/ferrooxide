[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/freand76/ferrooxide"
description = "A fast 4-state, event-driven Verilog simulator with a Cranelift JIT"

# development and tests: optimized, but quick to build
[profile.release]
opt-level = 3
debug = 1

# speed measurements: `cargo build --profile speed` -> target/speed/ferrooxide
[profile.speed]
inherits = "release"
lto = "fat"
codegen-units = 1
